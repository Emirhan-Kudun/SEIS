<!DOCTYPE html>

<head>

  <meta name="keywords" content="İtalya ilham, müze, resim sergisi, fotoğrafçılık sergisi, tasarım referansı">
  <meta property="og:title" content="Yurtdışı İlham | İtalya Müze ve Sergi Seçkisi">
  <meta property="og:description" content="İtalya odaklı müze, resim sergisi ve fotoğrafçılık sergisi ilham galerisi.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/italy-inspiration/6d706aa0-4f30-4775-8df6-3028265385f3.JPG">
  <link rel="stylesheet" href="./merged-portfolio.css">
  <link rel="stylesheet" href="./yurtdisi-ilham-italya.css">
</head>
<body class="inspiration-body">
  <main id="italy-inspiration">
    <section class="inspiration-hero">
      <p class="section-label">Yurtdışı İlham — İtalya</p>
      <h1 class="inspiration-title">Müze, Resim Sergisi ve <em>Fotoğrafçılık Sergileri</em></h1>
      <p class="inspiration-desc">
        Bu sayfa yalnızca İtalya odaklı ilham materyallerini içerir. Seçkide alkol ve yemek odaklı içerik bulunmaz.
      </p>
      <div class="inspiration-actions">
        <a class="inspiration-link" href="./merged-portfolio.html">Portfolyoya Dön</a>
        <a class="inspiration-link" href="https://www.behance.net/emirhankudun" target="_blank" rel="noopener">Behance Profili</a>
      </div>
    </section>

    <section class="inspiration-content">
      <div class="inspiration-filters" role="tablist" aria-label="İtalya ilham kategori filtreleri">
        <button class="inspiration-filter active" type="button" data-filter="all" role="tab" aria-selected="true">Tümü</button>
        <button class="inspiration-filter" type="button" data-filter="muze" role="tab" aria-selected="false">Müze</button>
        <button class="inspiration-filter" type="button" data-filter="resim-sergisi" role="tab" aria-selected="false">Resim Sergisi</button>
        <button class="inspiration-filter" type="button" data-filter="fotograf-sergisi" role="tab" aria-selected="false">Fotoğrafçılık Sergisi</button>
      </div>

      <div id="italy-grid" class="inspiration-grid" aria-live="polite"></div>
      <p id="italy-empty-state" class="inspiration-empty" aria-live="polite">
        Bu filtre için uygun içerik bulunamadı.
      </p>
    </section>
  </main>

  <script src="./yurtdisi-ilham-italya.js" defer></script>
