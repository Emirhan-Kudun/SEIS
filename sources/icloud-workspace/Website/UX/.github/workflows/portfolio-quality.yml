name: Portfolio Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run full quality gates
        run: npm run checks

      - name: Build all sites
        run: npm run build

      - name: Generate site budget report
        run: npm run report:budgets

      - name: Upload budget artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-budget-report
          path: docs/releases/site-budget-report.json
