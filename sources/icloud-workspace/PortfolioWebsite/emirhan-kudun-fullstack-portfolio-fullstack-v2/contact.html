<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=index.html#contact">
  <title>Yonlendiriliyor...</title>
  <meta name="description" content="Iletisim bolumune yonlendiriliyorsunuz.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://emirhankudun.com/#contact">
  <script>
    (function () {
      try {
        var lang = new URLSearchParams(window.location.search).get('lang');
        var target = 'index.html#contact';
        if (lang) {
          target = 'index.html?lang=' + encodeURIComponent(lang) + '#contact';
        }
        window.location.replace(target);
      } catch (err) {
        window.location.replace('index.html#contact');
      }
    }());
  </script>
</head>
<body>
  <noscript>
    <p>Bu sayfa tasindi. Iletisim bolumu icin <a href="index.html#contact">buraya tiklayin</a>.</p>
  </noscript>
</body>
</html>
