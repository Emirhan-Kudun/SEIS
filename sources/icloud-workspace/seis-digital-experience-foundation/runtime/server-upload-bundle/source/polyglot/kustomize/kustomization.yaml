apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  uix.apps/lane: kustomize
  uix.apps/status: reference
configMapGenerator:
  - name: readiness-signal
    literals:
      - ReadinessSignal=Kustomize overlay lane stays dependency-light.
      - lane=kustomize
      - runtimeWeight=dependency-light
generatorOptions:
  disableNameSuffixHash: true
