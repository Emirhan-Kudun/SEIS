name: Build & Test

on:
  push:
    branches: [ main, codex/premium-local-foundation ]
  pull_request:
    branches: [ main, codex/premium-local-foundation ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 24.x]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present

    - name: Check security
      run: npm audit --if-present

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify Docker image runs
      run: |
        docker build -t portfolio:test .
        docker run --rm portfolio:test node --version
        echo "Docker build successful!"

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy notification
      run: echo "Deployment would happen here (Heroku, AWS, etc.)"

    - name: Update deployment status
      if: always()
      run: echo "Deployment status: Success"
