name: UIX Apps Low Power CI

on:
  push:
    branches: [ UIXAppTTR ]
  pull_request:
    branches: [ UIXAppTTR ]

permissions:
  contents: read

concurrency:
  group: uix-apps-low-power-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository intake
        run: npm run check:repository-intake

      - name: Development program
        run: npm run check:development-program

      - name: Polyglot contracts
        run: npm run check:software-languages && npm run check:polyglot-foundation

      - name: Server handoff
        run: npm run check:server-handoff

      - name: Source intake
        run: npm run check:source-intake

      - name: Static lint bundle
        run: npm run lint

      - name: Unit tests
        run: npm test
