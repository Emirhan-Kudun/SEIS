version: '3.9'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: development
      PORT: 4173
      HOST: 0.0.0.0
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Development version with hot reload
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4174:4173"
    environment:
      NODE_ENV: development
      PORT: 4173
      HOST: 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    profiles:
      - dev
