# SEIS cloud-vm-ssh hardening drop-in (example)
# Install as /etc/ssh/sshd_config.d/10-seis-hardening.conf then: sshd -t && systemctl reload ssh
# Values are safe defaults; adjust Port and AllowGroups to your environment.

Port 22
Protocol 2

# Key-only auth — no passwords, no root login
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Limit who may log in (create this group and add operators)
AllowGroups seis-ssh

# Reduce attack surface
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

# Verbose logging for audit
LogLevel VERBOSE
