# SEIS VPN fallback — raw WireGuard peer (example)
# Use only if NetBird is not chosen. Generate keys with `wg genkey | tee priv | wg pubkey`.
# Keep real private keys OUT of git; this file is a template.

[Interface]
# This peer's private key (placeholder — load from secret store at deploy time)
PrivateKey = REPLACE_WITH_PEER_PRIVATE_KEY
Address = 10.10.0.2/32
DNS = 10.10.0.1

[Peer]
# VPN server public key
PublicKey = REPLACE_WITH_SERVER_PUBLIC_KEY
# Public endpoint of the WireGuard server
Endpoint = vpn.example.com:51820
# Least-privilege: only route the internal subnet over the tunnel
AllowedIPs = 10.10.0.0/24
PersistentKeepalive = 25
