name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate plugin package
        run: npm run validate

      - name: Run strict plugin doctor
        run: npm run doctor:strict

      - name: Check bridge health snapshot
        run: npm run bridge:snapshot:check
