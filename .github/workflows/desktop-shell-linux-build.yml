name: Desktop Shell (Linux build)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop-shell-linux-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop-shell-linux-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/native/src-tauri/target
          key: ${{ runner.os }}-desktop-shell-cargo-${{ hashFiles('apps/desktop/native/src-tauri/Cargo.lock') }}

      - name: Install GTK/WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup2.4-dev build-essential \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config xvfb

      - name: Alias webkit2gtk-4.0/javascriptcoregtk-4.0 to the installed 4.1 libraries
        # Tauri v1's webkit2gtk crate (v0.18.x, pulled in transitively) only
        # looks up the *-4.0 pkg-config names and *.so filenames; Ubuntu
        # 24.04 (this runner's image) only ships the 4.1 API. See
        # apps/desktop/native/README.md for the full explanation.
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc \
                      /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.1.pc \
                      /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.0.pc
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so \
                      /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so \
                      /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.0.so
          sudo ldconfig

      - name: Stage cockpit + design-system assets
        run: node apps/desktop/native/stage-assets.mjs

      - name: Build the Tauri shell
        working-directory: apps/desktop/native/src-tauri
        run: cargo build --locked

      - name: Headless smoke test (launch under Xvfb)
        working-directory: apps/desktop/native/src-tauri
        run: |
          set +e
          xvfb-run -a timeout 8 ./target/debug/seis-desktop-shell
          code=$?
          set -e
          # 0 = clean exit, 124 = timeout killed it while still running (expected
          # for a GUI app with no quit path); anything else is a real crash.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Shell exited with unexpected code $code"
            exit 1
          fi
          echo "Shell launched successfully under Xvfb (exit code $code)"
